name: Build iOS IPA

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'ios/**'
      - '.github/workflows/build-ipa.yml'
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build XT-Music IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build iOS Application (.app)
        run: |
          xcodebuild -project ios/XT-Music.xcodeproj \
            -scheme XT-Music \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build_dir \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package .app into .ipa
        run: |
          mkdir -p ipa_output/Payload
          cp -r build_dir/Build/Products/Release-iphoneos/XT-Music.app ipa_output/Payload/
          cd ipa_output
          zip -r XT-Music.ipa Payload
          cd ..
          mkdir -p dist
          mv ipa_output/XT-Music.ipa dist/XT-Music.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XT-Music-IPA
          path: dist/XT-Music.ipa
          retention-days: 30
