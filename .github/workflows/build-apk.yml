name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Telegram Music APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Build Android Debug APK
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Rename APK for distribution
        run: |
          mkdir -p build_output
          cp android/app/build/outputs/apk/debug/app-debug.apk build_output/Telegram-Music.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Music-APK
          path: build_output/Telegram-Music.apk
          retention-days: 30

