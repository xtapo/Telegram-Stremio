name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build XT-Music APK
    runs-on: ubuntu-latest
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: 1.0.${{ github.run_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Build Phone and TV release APKs
        run: |
          cd android
          gradle assemblePhoneRelease assembleTvRelease --stacktrace

      - name: Prepare APKs for distribution
        run: |
          mkdir -p build_output
          cp android/app/build/outputs/apk/phone/release/app-phone-release.apk "build_output/XT-Music-Phone-v${APP_VERSION_NAME}.apk"
          cp android/app/build/outputs/apk/tv/release/app-tv-release.apk "build_output/XT-Music-TV-v${APP_VERSION_NAME}.apk"

      - name: Upload Phone APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: XT-Music-Phone-v${{ env.APP_VERSION_NAME }}
          path: build_output/XT-Music-Phone-v${{ env.APP_VERSION_NAME }}.apk
          retention-days: 30

      - name: Upload TV APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: XT-Music-TV-v${{ env.APP_VERSION_NAME }}
          path: build_output/XT-Music-TV-v${{ env.APP_VERSION_NAME }}.apk
          retention-days: 30


