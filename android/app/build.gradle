plugins {
    id 'com.android.application'
}

def appVersionCode = (System.getenv("APP_VERSION_CODE") ?: "1") as Integer
def appVersionName = System.getenv("APP_VERSION_NAME") ?: "1.0.0"

android {
    namespace 'com.telegramstremio.music'
    compileSdk 34

    flavorDimensions += "device"

    defaultConfig {
        applicationId "com.telegramstremio.music"
        minSdk 24
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
    }

    productFlavors {
        phone {
            dimension "device"
            applicationIdSuffix ".phone"
            versionNameSuffix "-phone"
            buildConfigField "String", "APP_TARGET", '"phone"'
            resValue "string", "app_name", "XT-Music Phone"
        }
        tv {
            dimension "device"
            applicationIdSuffix ".tv"
            versionNameSuffix "-tv"
            buildConfigField "String", "APP_TARGET", '"tv"'
            resValue "string", "app_name", "XT-Music TV"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.media:media:1.7.0'
}
